server:
  port: 8080

spring:
  application:
    name: api-gateway
  data:
    redis:
      host: localhost
      port: 6379
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: merchant-service
              uri: http://localhost:8083
              predicates:
                - Path=/api/v1/auth/**, /api/v1/merchants/**
              filters:
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 10
                    redis-rate-limiter.burstCapacity: 20
                    key-resolver: "#{@merchantIdKeyResolver}"
            - id: payment-service
              uri: http://localhost:8081
              predicates:
                - Path=/api/v1/payments/**
              filters:
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 10
                    redis-rate-limiter.burstCapacity: 20
                    key-resolver: "#{@merchantIdKeyResolver}"
  security:
    jwt:
      secret-key: ${JWT_SECRET_KEY}