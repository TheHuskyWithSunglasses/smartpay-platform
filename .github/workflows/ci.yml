name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  packages: write
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Set lowercase repository name
        run: echo "REPO_LOWER=$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Build Docker images
        run: |
          docker build -t ghcr.io/${{ env.REPO_LOWER }}/api-gateway:${{ github.sha }} -f api-gateway/Dockerfile .
          docker build -t ghcr.io/${{ env.REPO_LOWER }}/merchant-service:${{ github.sha }} -f merchant-service/Dockerfile .
          docker build -t ghcr.io/${{ env.REPO_LOWER }}/payment-service:${{ github.sha }} -f payment-service/Dockerfile .
          docker build -t ghcr.io/${{ env.REPO_LOWER }}/notification-service:${{ github.sha }} -f notification-service/Dockerfile .

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Docker images
        run: |
          docker push ghcr.io/${{ env.REPO_LOWER }}/api-gateway:${{ github.sha }}
          docker push ghcr.io/${{ env.REPO_LOWER }}/merchant-service:${{ github.sha }}
          docker push ghcr.io/${{ env.REPO_LOWER }}/payment-service:${{ github.sha }}
          docker push ghcr.io/${{ env.REPO_LOWER }}/notification-service:${{ github.sha }}