spring:
  application:
    name: merchant-service
  jpa:
    hibernate.ddl-auto: none
    show-sql: true
  datasource:
    url: jdbc:postgresql://localhost:5432/smartpay
    username: smartpay
    password: example
  data:
    redis:
      host: localhost
      port: 6379
  liquibase:
    enabled: true
  security:
    jwt:
      secret-key: ${JWT_SECRET_KEY}
      expiration-time: ${JWT_EXPIRATION:86400000}