services:
  db:
    image: postgres:15
    restart: always
    networks:
      - smartpay-network
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: smartpay
      POSTGRES_USER: smartpay
      POSTGRES_PASSWORD: example
    ports:
      - "5432:5432"
  payment-db:
    image: postgres:15
    restart: always
    networks:
      - smartpay-network
    volumes:
      - payment_postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: smartpay_payments
      POSTGRES_USER: smartpay
      POSTGRES_PASSWORD: example
    ports:
      - "5433:5432"
  redis:
    image: redis:7
    networks:
      - smartpay-network
    ports:
      - "6379:6379"
    restart: always
  kafka:
    image: apache/kafka:3.7.0
    ports:
      - "9092:9092"
    networks:
      - smartpay-network
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
volumes:
  postgres_data:
  payment_postgres_data:
networks:
  smartpay-network:
    driver: bridge