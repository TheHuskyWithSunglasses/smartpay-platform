services:

  db:
    image: postgres:15
    restart: always
    networks:
      - smartpay-network
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: smartpay
      POSTGRES_USER: smartpay
      POSTGRES_PASSWORD: example
    ports:
      - "5432:5432"

  payment-db:
    image: postgres:15
    restart: always
    networks:
      - smartpay-network
    volumes:
      - payment_postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: smartpay_payments
      POSTGRES_USER: smartpay
      POSTGRES_PASSWORD: example
    ports:
      - "5433:5432"

  notification-db:
    image: postgres:15
    restart: always
    networks:
      - smartpay-network
    volumes:
      - notification_postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: smartpay_notifications
      POSTGRES_USER: smartpay
      POSTGRES_PASSWORD: example
    ports:
      - "5434:5432"

  redis:
    image: redis:7
    restart: always
    networks:
      - smartpay-network
    ports:
      - "6379:6379"

  kafka:
    image: apache/kafka:3.7.0
    container_name: smartpay-kafka
    restart: always
    networks:
      - smartpay-network
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

volumes:
  postgres_data:
  payment_postgres_data:
  notification_postgres_data:

networks:
  smartpay-network:
    driver: bridge
